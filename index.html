<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>島ねこコレクション</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif; background-color: #fdf6e3; color: #5c4b51; margin: 0; padding: 0; overflow: hidden; }
        
        #map-screen { position: absolute; top: 0; bottom: 0; left: 0; right: 0; transition: filter 2s; }
        #map { height: 100%; width: 100%; z-index: 0; }
        .ui-layer { position: absolute; z-index: 1000; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        #garden-screen { display: none; position: absolute; inset: 0; z-index: 1500; background-image: url('./garden.png'); background-size: cover; background-position: center; overflow: hidden; }
        
        .garden-cat { position: absolute; transition: top 3s linear, left 3s linear, transform 0.5s; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); cursor: pointer; }

        .custom-popup .leaflet-popup-content-wrapper { background-color: #ffe8d6; color: #333; border-radius: 12px; font-weight: bold; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid #fb923c; }
        .custom-popup .leaflet-popup-tip { background-color: #fb923c; }
        
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .bounce-active { animation: bounce 0.5s ease 2; }
        .face-left { transform: scaleX(-1); }
        .face-right { transform: scaleX(1); }
        .cat-wrapper { transition: transform 0.3s ease, opacity 0.5s ease, width 0.3s ease, height 0.3s ease; filter: drop-shadow(0 6px 6px rgba(0,0,0,0.5)); }
        .fade-out { opacity: 0; }
        #zukan-modal { display: none; }
        #zukan-modal.show { display: flex; }

        /* 【天気・時間シンクロ用CSS】 */
        body.is-sunset #map-screen { filter: sepia(0.4) hue-rotate(-15deg) saturate(1.5) brightness(0.9); }
        body.is-night #map-screen { filter: brightness(0.5) contrast(1.2) hue-rotate(180deg); }
        
        .rain-layer { position: absolute; inset: 0; pointer-events: none; z-index: 900; background-image: linear-gradient(160deg, transparent 0%, transparent 95%, rgba(255,255,255,0.7) 100%); background-size: 15px 80px; animation: rainFall 0.4s linear infinite; display: none; }
        body.is-raining .rain-layer { display: block; }
        @keyframes rainFall { 0% { background-position: 0 0; } 100% { background-position: -15px 80px; } }
    </style>
</head>
<body class="w-screen relative" style="height: 100dvh;">

    <!-- 雨エフェクトレイヤー -->
    <div class="rain-layer"></div>

    <div id="start-screen" class="absolute inset-0 bg-[#fdf6e3] flex flex-col items-center justify-center z-[4000] transition-opacity duration-500">
        <h1 class="text-5xl font-black text-orange-600 mb-8 text-center leading-tight">とびしま<br>ねこあつめ</h1>
        <button id="start-btn" class="bg-orange-500 hover:bg-orange-600 text-white px-10 py-6 rounded-full font-bold text-2xl shadow-xl transition-transform hover:scale-105 border-4 border-white interactive">はじめる</button>
        <p class="text-base text-gray-600 mt-6 font-bold">※音が鳴ります</p>
    </div>

    <div id="map-screen">
        <div id="map"></div>
        <div id="loading" class="absolute inset-0 bg-[#fdf6e3]/90 flex items-center justify-center z-[2000] hidden">
            <div class="text-center">
                <p class="text-2xl font-bold animate-pulse text-orange-600">GPSを探しています...</p>
            </div>
        </div>

        <div class="ui-layer top-0 left-0 w-full p-4 pt-6 flex flex-col items-center gap-2">
            <div class="bg-white/95 backdrop-blur-md px-8 py-3 rounded-full shadow-md text-center interactive border-2 border-orange-200">
                <p id="island-name" class="text-base text-orange-700 font-black">現在地を確認中...</p>
            </div>
            <!-- 【追加】滞在時間タイマーUI -->
            <div id="stay-ui" class="bg-blue-100/90 backdrop-blur-md px-6 py-2 rounded-full shadow-md text-center interactive border border-blue-300 hidden transition-all">
                <p id="stay-text" class="text-sm text-blue-800 font-bold animate-pulse">スポットで休憩中…</p>
            </div>
        </div>

        <div id="recenter-container" class="ui-layer bottom-32 left-0 w-full flex justify-center transition-all duration-300 opacity-0 pointer-events-none translate-y-4">
            <button id="recenter-btn" class="bg-blue-500 text-white px-6 py-3 rounded-full font-bold text-base shadow-lg border-2 border-white interactive flex items-center gap-2">📍 現在地に戻る</button>
        </div>

        <!-- 【UI整理】下部のボタンが押しやすいように両サイドに配置 -->
        <div class="ui-layer bottom-0 left-0 w-full p-3 pb-6 flex justify-between items-end gap-2">
            <!-- 左側ボタン群 -->
            <div class="flex flex-col gap-3">
                <button id="go-garden-btn" class="bg-green-500 text-white w-14 h-14 rounded-full text-2xl shadow-lg interactive border-4 border-white">🏡</button>
                <button id="open-ar-btn" class="bg-pink-400 text-white w-14 h-14 rounded-full text-2xl shadow-lg interactive border-4 border-white animate-bounce">✨</button>
            </div>
            
            <!-- 中央ゲージ -->
            <div class="bg-white/95 backdrop-blur-md px-2 py-2 rounded-3xl shadow-lg flex flex-1 flex-col items-center justify-center interactive border-2 border-orange-200 max-w-[140px]">
                <div class="flex items-center justify-center gap-1 mb-1 w-full">
                    <div class="w-8 h-8 shrink-0 bg-orange-100 rounded-full flex items-center justify-center text-lg shadow-inner">🐟</div>
                    <div class="text-center">
                        <p class="text-[9px] text-gray-600 font-bold leading-none mb-1">エサ</p>
                        <p id="food-count" class="font-black text-xl leading-none text-gray-800">3</p>
                    </div>
                </div>
                <div class="w-full bg-orange-100 rounded-full h-3 relative overflow-hidden border border-orange-200">
                    <div id="distance-bar" class="bg-orange-500 h-full w-[0%] transition-all duration-300"></div>
                    <p id="distance-progress" class="absolute inset-0 flex items-center justify-center text-[9px] font-bold text-gray-800 leading-none">あと 50m</p>
                </div>
            </div>

            <!-- 右側ボタン群 -->
            <div class="flex flex-col gap-3">
                <button id="open-qr-btn" class="bg-yellow-400 text-white w-14 h-14 rounded-full text-2xl shadow-lg interactive border-4 border-white">📷</button>
                <button id="open-zukan" class="bg-indigo-500 text-white w-14 h-14 rounded-full text-2xl shadow-lg interactive border-4 border-white">📖</button>
            </div>
        </div>
    </div>

    <!-- お庭、図鑑、拡大画像のモーダルはそのまま -->
    <div id="garden-screen"><div class="absolute top-8 left-4 z-10"><button id="back-map-btn" class="bg-white/95 text-gray-800 px-6 py-3 rounded-full font-bold text-lg shadow-md border-2 border-gray-200 interactive">◀ マップ</button></div><div id="garden-container" class="w-full h-full relative"></div></div>
    
    <div id="zukan-modal" class="fixed inset-0 bg-black/60 z-[3000] items-center justify-center p-4 backdrop-blur-sm"><div class="bg-[#fdf6e3] rounded-3xl p-6 w-full max-w-sm shadow-2xl relative interactive border-4 border-indigo-200 flex flex-col max-h-[90dvh]"><h2 class="text-2xl font-black text-center text-indigo-800 mb-1">ねこ図鑑</h2><p class="text-center text-[11px] text-orange-600 font-bold mb-4">※まるい画像をタップで拡大</p><div id="cat-detail" class="bg-white rounded-2xl p-4 mb-4 min-h-[100px] flex items-center justify-center text-center shadow-inner border border-gray-200 shrink-0"><p class="text-gray-500 font-bold">ねこをタップするニャ</p></div><div class="grid grid-cols-3 gap-3 overflow-y-auto p-1 flex-1" id="zukan-list"></div><div class="mt-6 text-center shrink-0"><button id="close-zukan" class="bg-gray-300 px-10 py-4 rounded-full font-bold text-lg shadow-sm">とじる</button><p id="open-reset-btn" class="text-[11px] text-gray-400 font-bold mt-4 underline cursor-pointer p-2">データを初期化する</p></div></div></div>

    <div id="image-modal" class="fixed inset-0 bg-black/80 z-[5000] hidden flex-col items-center justify-center p-4 interactive"><div class="w-full max-w-md flex justify-end mb-2 pr-4"><button id="close-image-modal" class="text-white text-5xl font-bold">&times;</button></div><img id="enlarged-image" src="" class="w-[90%] max-w-[300px] object-contain filter drop-shadow-lg"></div>

    <div id="qr-modal" class="fixed inset-0 bg-black/90 z-[6000] hidden flex-col items-center justify-center p-4 interactive"><h2 class="text-white text-xl font-bold mb-4">シークレットQRを探せ！</h2><div id="qr-reader" class="w-full max-w-sm bg-white rounded-xl overflow-hidden mb-6"></div><button id="close-qr-btn" class="bg-red-500 text-white px-8 py-3 rounded-full font-bold text-lg">やめる</button></div>

    <div id="custom-alert-modal" class="fixed inset-0 bg-black/60 z-[7000] hidden flex-col items-center justify-center p-4 interactive"><div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl relative text-center border-4 border-orange-200"><h3 id="custom-alert-title" class="text-2xl font-black text-gray-800 mb-3"></h3><p id="custom-alert-message" class="text-base text-gray-600 font-bold mb-6"></p><button id="custom-alert-close" class="bg-orange-500 text-white px-10 py-3 rounded-full font-bold text-lg">OK</button></div></div>

    <div id="reset-confirm-modal" class="fixed inset-0 bg-black/80 z-[7000] hidden flex-col items-center justify-center p-4 interactive"><div class="bg-[#fdf6e3] rounded-3xl p-6 w-full max-w-sm shadow-2xl text-center border-4 border-red-300"><h3 class="text-2xl font-black text-red-600 mb-4">⚠️ データ初期化</h3><p class="text-sm text-gray-700 font-bold mb-6 text-left">記録がすべて消去されます。</p><label class="flex items-center justify-center gap-2 mb-6 bg-white p-4 rounded-xl cursor-pointer shadow-sm"><input type="checkbox" id="reset-checkbox" class="w-6 h-6 rounded accent-red-500"><span class="text-base font-bold text-gray-800">はい、初期化します</span></label><div class="flex gap-3 justify-center w-full"><button id="cancel-reset-btn" class="flex-1 bg-gray-300 py-3 rounded-full font-bold">やめる</button><button id="execute-reset-btn" class="flex-1 bg-gray-400 text-white py-3 rounded-full font-bold pointer-events-none" disabled>消去する</button></div></div></div>

    <!-- 【追加】AR撮影用モーダル -->
    <div id="ar-modal" class="fixed inset-0 bg-black z-[8000] hidden flex-col interactive">
        <video id="ar-video" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline></video>
        <!-- AR上に配置される猫（ドラッグ可能） -->
        <img id="ar-cat-img" src="" class="absolute hidden w-40 h-40 object-contain drop-shadow-[0_10px_15px_rgba(0,0,0,0.6)]" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">
        
        <div id="ar-ui-layer" class="absolute inset-0 flex flex-col justify-between p-4 pointer-events-none">
            <button id="close-ar-btn" class="self-end bg-red-500 text-white px-4 py-2 rounded-full font-bold pointer-events-auto border-2 border-white shadow-lg">✖ 閉じる</button>
            
            <div class="flex flex-col gap-3 pointer-events-auto items-center">
                <p class="text-white text-xs font-bold drop-shadow-md bg-black/50 px-3 py-1 rounded-full">猫を選んでドラッグ！</p>
                <!-- 取得済みの猫リスト -->
                <div id="ar-cat-selector" class="flex gap-3 overflow-x-auto bg-black/40 backdrop-blur-sm p-3 rounded-2xl w-full max-w-sm border border-white/30"></div>
                <!-- UI非表示ボタン -->
                <button id="ar-shutter-btn" class="bg-white/90 text-gray-800 px-6 py-3 rounded-full font-black text-sm shadow-xl border-2 border-gray-200">📸 UIを隠してスクショ</button>
            </div>
        </div>
    </div>

    <script src="./cats.js"></script>

    <script>
        const DEBUG_MODE = false; 
        const DUMMY_LAT = 34.1795;
        const DUMMY_LNG = 132.8365;

        const ISLANDS = {
            "osaki_shimojima": { name: "大崎下島", bounds: { minLat: 34.160, maxLat: 34.200, minLng: 132.800, maxLng: 132.870 } },
            "chiba_test": { name: "千葉テスト", bounds: { minLat: 35.0, maxLat: 36.0, minLng: 139.0, maxLng: 141.0 } }
        };

        // 【追加】滞在スポットの定義（緯度経度、半径m、必要滞在時間(秒)、アンロックされる猫ID）
        const STAY_SPOTS = [
            { id: "mamena", name: "まめな食堂", lat: 34.1795, lng: 132.8365, radius: 30, timeReq: 15 * 60, catId: "stay_mamena" },
            { id: "okiyuu", name: "沖友天満宮", lat: 34.1750, lng: 132.8600, radius: 30, timeReq: 3 * 60, catId: "stay_okiyuu" },
            // 千葉でのデバッグ用に、日本中どこでも引っかかりやすい巨大な円（半径1000km）を設定。10秒でクリア。
            { id: "debug_spot", name: "テストスポット", lat: 35.68, lng: 139.76, radius: 1000000, timeReq: 10, catId: "stay_test" }
        ];

        let currentIslandKey = null;
        let isCatSpawned = false;
        let foodCount = 3;
        let zukanData = JSON.parse(localStorage.getItem('tobishima_zukan')) || [];

        let lastLatLng = null;
        let distanceWalked = 0;
        const DISTANCE_TO_FOOD = 50; 
        let gpsWatchId = null;
        let isTracking = true;

        // 天気・時間用の状態
        let currentWeatherState = 'clear';
        let currentTimeState = 'day';
        let lastWeatherCheck = 0;

        // 滞在判定用の変数
        let activeStaySpot = null;
        let stayStartTime = 0;
        let stayTimerInterval = null;

        const catVoice = new Audio('./catvoice.mp3');

        // アラートとリセット処理（省略・前回のまま）
        const customAlertModal = document.getElementById('custom-alert-modal');
        const customAlertTitle = document.getElementById('custom-alert-title');
        const customAlertMessage = document.getElementById('custom-alert-message');
        function showCustomAlert(title, message) {
            customAlertTitle.innerHTML = title; customAlertMessage.innerHTML = message;
            customAlertModal.classList.remove('hidden'); customAlertModal.classList.add('flex');
        }
        document.getElementById('custom-alert-close').addEventListener('click', () => {
            customAlertModal.classList.add('hidden'); customAlertModal.classList.remove('flex');
        });

        document.getElementById('open-reset-btn').addEventListener('click', () => {
            document.getElementById('reset-checkbox').checked = false;
            let btn = document.getElementById('execute-reset-btn');
            btn.disabled = true; btn.className = "flex-1 bg-gray-400 text-white py-3 rounded-full font-bold pointer-events-none";
            document.getElementById('reset-confirm-modal').classList.remove('hidden'); document.getElementById('reset-confirm-modal').classList.add('flex');
        });
        document.getElementById('cancel-reset-btn').addEventListener('click', () => {
            document.getElementById('reset-confirm-modal').classList.add('hidden'); document.getElementById('reset-confirm-modal').classList.remove('flex');
        });
        document.getElementById('reset-checkbox').addEventListener('change', (e) => {
            let btn = document.getElementById('execute-reset-btn');
            if (e.target.checked) { btn.disabled = false; btn.className = "flex-1 bg-red-500 hover:bg-red-600 text-white py-3 rounded-full font-bold"; } 
            else { btn.disabled = true; btn.className = "flex-1 bg-gray-400 text-white py-3 rounded-full font-bold pointer-events-none"; }
        });
        document.getElementById('execute-reset-btn').addEventListener('click', () => {
            localStorage.removeItem('tobishima_zukan'); zukanData = []; foodCount = 3; distanceWalked = 0;
            document.getElementById('food-count').innerHTML = `3`; document.getElementById('distance-progress').innerText = `あと ${DISTANCE_TO_FOOD}m`; document.getElementById('distance-bar').style.width = `0%`;
            document.getElementById('reset-confirm-modal').classList.add('hidden'); document.getElementById('reset-confirm-modal').classList.remove('flex');
            document.getElementById('zukan-modal').classList.remove('show');
            showCustomAlert('データ初期化完了', '図鑑とエサのデータをリセットしました。');
        });

        // マップ初期化
        const map = L.map('map', { zoomControl: false }).setView([35.681236, 139.767125], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

        const BASE_ICON_SIZE = 80;
        let playerMarker = null, activeCatMarker = null, activeCatIconOptions = null, moveInterval = null;

        const recenterContainer = document.getElementById('recenter-container');
        map.on('dragstart', () => {
            if (isTracking) {
                isTracking = false;
                recenterContainer.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
                recenterContainer.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
            }
        });
        document.getElementById('recenter-btn').addEventListener('click', () => {
            isTracking = true;
            recenterContainer.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
            recenterContainer.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            if (playerMarker) map.setView(playerMarker.getLatLng(), map.getZoom());
        });

        map.on('zoomend', function() {
            if(activeCatMarker && activeCatIconOptions) {
                let scale = Math.pow(1.5, map.getZoom() - 17);
                const newSize = Math.max(60, Math.min(BASE_ICON_SIZE * scale, 200));
                const catImg = document.getElementById('cat-image');
                if(catImg) { catImg.style.width = `${newSize}px`; catImg.style.height = `${newSize}px`; }
                const newIcon = L.divIcon({ html: activeCatIconOptions.html.replace(/width: \d+px; height: \d+px;/, `width: ${newSize}px; height: ${newSize}px;`), className: '', iconSize: [newSize, newSize], iconAnchor: [newSize/2, newSize], popupAnchor: [0, -newSize] });
                activeCatMarker.setIcon(newIcon);
            }
        });

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function addToZukan(catId) {
            if (!zukanData.includes(catId)) {
                zukanData.push(catId);
                localStorage.setItem('tobishima_zukan', JSON.stringify(zukanData));
            }
        }

        // ==========================================
        // 猫をマップに出す処理（条件判定付き）
        // ==========================================
        function spawnSpecificCat(catId, playerLatLng) {
            if (!CAT_DATA[catId] || isCatSpawned) return;
            executeSpawn(CAT_DATA[catId], playerLatLng);
        }

        function spawnRandomCat(playerLatLng) {
            if (isCatSpawned) return;
            const availableCats = [];
            
            for (const key in CAT_DATA) {
                const cat = CAT_DATA[key];
                // is_special: true の猫（QRや滞在専用）はランダム出現させない
                if (cat.is_special) continue; 
                
                // 天気と時間の条件判定（設定がなければ all とみなす）
                const timeMatch = (!cat.spawn_time || cat.spawn_time === "all" || cat.spawn_time === currentTimeState);
                const weatherMatch = (!cat.spawn_weather || cat.spawn_weather === "all" || cat.spawn_weather === currentWeatherState);
                
                if (timeMatch && weatherMatch) availableCats.push(cat);
            }

            if (availableCats.length === 0) return;
            executeSpawn(availableCats[Math.floor(Math.random() * availableCats.length)], playerLatLng);
        }

        function executeSpawn(selectedCat, playerLatLng) {
            isCatSpawned = true;
            catVoice.currentTime = 0; catVoice.play().catch(e => {});
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

            activeCatIconOptions = { html: `<img src="${selectedCat.image}" id="cat-image" class="cat-wrapper" style="width: ${BASE_ICON_SIZE}px; height: ${BASE_ICON_SIZE}px;">` };
            const catIcon = L.divIcon({ html: activeCatIconOptions.html, className: '', iconSize: [BASE_ICON_SIZE, BASE_ICON_SIZE], iconAnchor: [BASE_ICON_SIZE/2, BASE_ICON_SIZE], popupAnchor: [0, -BASE_ICON_SIZE] });

            let catCurrentLatLng = L.latLng(playerLatLng.lat + (Math.random()*0.001 - 0.0005), playerLatLng.lng + (Math.random()*0.001 - 0.0005));
            activeCatMarker = L.marker(catCurrentLatLng, { icon: catIcon }).addTo(map);
            
            activeCatMarker.on('click', () => {
                if(foodCount > 0) {
                    foodCount--; document.getElementById('food-count').innerHTML = `${foodCount}`;
                    addToZukan(selectedCat.id);
                    activeCatMarker.bindPopup(`<b style="font-size: 16px;">「ありがとうニャ！」<br><span style="color: #ea580c; font-size: 12px; margin-top: 4px;">お庭に遊びにくるようになったニャ！</span></b>`, { className: 'custom-popup' }).openPopup();
                    setTimeout(() => {
                        document.getElementById('cat-image').classList.add('fade-out');
                        setTimeout(() => { map.removeLayer(activeCatMarker); clearInterval(moveInterval); isCatSpawned = false; }, 500);
                    }, 3000);
                } else {
                    activeCatMarker.bindPopup('<b style="font-size: 16px;">「エサがないニャ...」</b>', { className: 'custom-popup' }).openPopup();
                }
            });

            let target = L.latLng(catCurrentLatLng.lat + (Math.random()-0.5)*0.0001, catCurrentLatLng.lng + (Math.random()-0.5)*0.0001);
            moveInterval = setInterval(() => {
                const spd = 0.02;
                catCurrentLatLng = L.latLng(catCurrentLatLng.lat + (target.lat - catCurrentLatLng.lat)*spd, catCurrentLatLng.lng + (target.lng - catCurrentLatLng.lng)*spd);
                activeCatMarker.setLatLng(catCurrentLatLng);
                const img = document.getElementById('cat-image');
                if (img) {
                    if ((target.lng - catCurrentLatLng.lng) > 0) { img.classList.remove('face-left'); img.classList.add('face-right'); } 
                    else { img.classList.remove('face-right'); img.classList.add('face-left'); }
                    if (Math.random() < 0.02) { img.classList.add('bounce-active'); setTimeout(() => img.classList.remove('bounce-active'), 1000); }
                }
                if (Math.abs(target.lat - catCurrentLatLng.lat) < 0.000001) target = L.latLng(catCurrentLatLng.lat + (Math.random()-0.5)*0.0001, catCurrentLatLng.lng + (Math.random()-0.5)*0.0001);
            }, 50);
        }


        // ==========================================
        // 【追加】天気の取得 (5分ごと)
        // ==========================================
        function checkWeather(lat, lng) {
            if (Date.now() - lastWeatherCheck < 5 * 60 * 1000 && !DEBUG_MODE) return;
            lastWeatherCheck = Date.now();
            
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`)
            .then(res => res.json())
            .then(data => {
                let code = data.current_weather.weathercode;
                // WMOコード: 51以上が雨や雪
                if (code >= 51 && code <= 99) {
                    document.body.classList.add('is-raining');
                    currentWeatherState = 'rain';
                } else {
                    document.body.classList.remove('is-raining');
                    currentWeatherState = 'clear';
                }
            }).catch(e => console.log('天気取得エラー'));
        }

        // ==========================================
        // 【追加】時間のチェック (毎分)
        // ==========================================
        function checkTime() {
            const h = new Date().getHours();
            if (h >= 16 && h < 18) {
                document.body.classList.add('is-sunset'); document.body.classList.remove('is-night'); currentTimeState = 'sunset';
            } else if (h >= 18 || h < 5) {
                document.body.classList.add('is-night'); document.body.classList.remove('is-sunset'); currentTimeState = 'night';
            } else {
                document.body.classList.remove('is-sunset', 'is-night'); currentTimeState = 'day';
            }
        }
        setInterval(checkTime, 60000);
        checkTime(); // 初回実行

        // ==========================================
        // 【追加】滞在時間の判定
        // ==========================================
        function checkStaySpot(lat, lng) {
            let found = STAY_SPOTS.find(s => getDistance(lat, lng, s.lat, s.lng) <= s.radius);
            
            if (found) {
                // 新しいスポットに入ったか、同じスポットに居続けているか
                if (!activeStaySpot || activeStaySpot.id !== found.id) {
                    activeStaySpot = found;
                    stayStartTime = Date.now();
                    document.getElementById('stay-ui').classList.remove('hidden');
                    
                    if(stayTimerInterval) clearInterval(stayTimerInterval);
                    stayTimerInterval = setInterval(() => {
                        let passedSec = Math.floor((Date.now() - stayStartTime) / 1000);
                        let remain = activeStaySpot.timeReq - passedSec;
                        if(remain > 0) {
                            let m = Math.floor(remain / 60);
                            let s = remain % 60;
                            document.getElementById('stay-text').innerText = `${activeStaySpot.name}で休憩中… あと${m}分${s}秒`;
                        } else {
                            // 達成！
                            clearInterval(stayTimerInterval);
                            document.getElementById('stay-text').innerText = `✨ ${activeStaySpot.name}達成！ ✨`;
                            spawnSpecificCat(activeStaySpot.catId, L.latLng(lat, lng));
                            activeStaySpot = null;
                            setTimeout(() => document.getElementById('stay-ui').classList.add('hidden'), 3000);
                        }
                    }, 1000);
                }
            } else {
                // スポットから出た場合
                activeStaySpot = null;
                if(stayTimerInterval) clearInterval(stayTimerInterval);
                document.getElementById('stay-ui').classList.add('hidden');
            }
        }


        function updateLocation(lat, lng) {
            const playerLatLng = L.latLng(lat, lng);
            document.getElementById('loading').style.display = 'none';

            if (!playerMarker) { playerMarker = L.marker(playerLatLng).addTo(map); map.setView(playerLatLng, 17); } 
            else { playerMarker.setLatLng(playerLatLng); if (isTracking) map.panTo(playerLatLng); }

            if (lastLatLng && !DEBUG_MODE) {
                const dist = getDistance(lastLatLng.lat, lastLatLng.lng, lat, lng);
                if (dist > 1 && dist < 50) {
                    distanceWalked += dist;
                    if (distanceWalked >= DISTANCE_TO_FOOD) {
                        foodCount++; distanceWalked = 0; document.getElementById('food-count').innerHTML = `${foodCount}`;
                    }
                    const remain = Math.max(0, DISTANCE_TO_FOOD - distanceWalked);
                    document.getElementById('distance-progress').innerText = `あと ${Math.ceil(remain)}m`;
                    document.getElementById('distance-bar').style.width = `${(distanceWalked / DISTANCE_TO_FOOD) * 100}%`;
                }
            }
            lastLatLng = { lat: lat, lng: lng };

            // 天気と滞在スポットのチェック
            checkWeather(lat, lng);
            checkStaySpot(lat, lng);

            let isIsland = false;
            for (const key in ISLANDS) {
                const b = ISLANDS[key].bounds;
                if (lat >= b.minLat && lat <= b.maxLat && lng >= b.minLng && lng <= b.maxLng) { isIsland = true; document.getElementById('island-name').innerText = `〜 ${ISLANDS[key].name} 〜`; break; }
            }
            if (isIsland) { if (!window.spawnTimer) window.spawnTimer = setInterval(() => { if (!isCatSpawned && Math.random() < 0.2) spawnRandomCat(playerMarker.getLatLng()); }, 10000); } 
            else { document.getElementById('island-name').innerText = "ここはねこがいないエリアみたい"; if(window.spawnTimer) { clearInterval(window.spawnTimer); window.spawnTimer = null; } }
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            catVoice.play().then(() => { catVoice.pause(); catVoice.currentTime = 0; }).catch(() => {});
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => { document.getElementById('start-screen').style.display = 'none'; }, 500);
            document.getElementById('loading').style.display = 'flex';

            if (navigator.geolocation) {
                gpsWatchId = navigator.geolocation.watchPosition(
                    (p) => { let lat = p.coords.latitude, lng = p.coords.longitude; if (DEBUG_MODE) { lat = DUMMY_LAT; lng = DUMMY_LNG; } updateLocation(lat, lng); },
                    (e) => { console.log(e); },
                    { enableHighAccuracy: true, maximumAge: 2000, timeout: 5000 }
                );
            }
        });

        // 庭、図鑑のコードはこれまでと同様（省略せずに記述）
        document.getElementById('go-garden-btn').addEventListener('click', () => {
            document.getElementById('map-screen').style.display = 'none'; document.getElementById('garden-screen').style.display = 'block';
            const gc = document.getElementById('garden-container'); gc.innerHTML = '';
            zukanData.forEach(id => {
                if (CAT_DATA[id]) {
                    const el = document.createElement('img'); el.src = CAT_DATA[id].image; el.className = 'garden-cat w-24 h-24 object-contain interactive';
                    el.style.top = `${Math.random() * 20 + 65}%`; el.style.left = `${Math.random() * 80 + 5}%`;
                    el.addEventListener('click', () => { catVoice.currentTime = 0; catVoice.play().catch(()=>{}); el.classList.add('bounce-active'); setTimeout(() => el.classList.remove('bounce-active'), 1000); });
                    gc.appendChild(el);
                    function move() { setTimeout(() => { if(Math.random()<0.3){ let l = Math.random() * 80 + 5; el.classList.remove('face-left','face-right'); el.classList.add(parseFloat(el.style.left) < l ? 'face-right' : 'face-left'); el.style.top = `${Math.random() * 20 + 65}%`; el.style.left = `${l}%`; } move(); }, Math.random() * 6000 + 2000); }
                    move();
                }
            });
        });
        document.getElementById('back-map-btn').addEventListener('click', () => { document.getElementById('garden-screen').style.display = 'none'; document.getElementById('map-screen').style.display = 'block'; map.invalidateSize(); });

        document.getElementById('open-zukan').addEventListener('click', () => {
            const zl = document.getElementById('zukan-list'); zl.innerHTML = '';
            for (const key in CAT_DATA) {
                const cat = CAT_DATA[key]; const isDisc = zukanData.includes(key);
                const el = document.createElement('div'); el.className = "flex flex-col items-center p-2 bg-white rounded-xl shadow-sm border border-gray-100 cursor-pointer";
                el.innerHTML = `<img src="${cat.image}" class="w-16 h-16 object-contain mb-2" style="${isDisc ? "" : "filter: brightness(0) invert(0.8);"}"><p class="text-xs font-bold">${isDisc ? cat.name : "？？？"}</p>`;
                el.addEventListener('click', () => {
                    if (isDisc) document.getElementById('cat-detail').innerHTML = `<div class="flex items-center gap-4 w-full"><div id="detail-img-btn" class="w-20 h-20 shrink-0 bg-orange-100 rounded-full flex items-center justify-center border-4 border-orange-200 cursor-pointer"><img src="${cat.image}" class="w-16 h-16 object-contain pointer-events-none"></div><div class="text-left"><p class="font-black text-indigo-800 text-xl">${cat.name}</p><p class="text-sm text-gray-700 mt-2 font-medium">${cat.description}</p></div></div>`;
                    else document.getElementById('cat-detail').innerHTML = `<div class="flex items-center gap-4 w-full"><div class="w-20 h-20 shrink-0 bg-gray-200 rounded-full flex items-center justify-center text-3xl text-gray-400 font-black border-4 border-gray-300">？</div><div class="text-left"><p class="font-black text-gray-500 text-xl">？？？</p><p class="text-sm text-gray-500 mt-2 font-medium">まだであっていないニャ</p></div></div>`;
                });
                zl.appendChild(el);
            }
            document.getElementById('zukan-modal').classList.add('show');
        });
        document.getElementById('close-zukan').addEventListener('click', () => document.getElementById('zukan-modal').classList.remove('show'));

        // QRカメラ
        let html5QrCode = null;
        document.getElementById('open-qr-btn').addEventListener('click', () => {
            document.getElementById('qr-modal').classList.remove('hidden'); document.getElementById('qr-modal').classList.add('flex');
            html5QrCode = new Html5Qrcode("qr-reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
            (dec) => {
                if(CAT_DATA[dec]) {
                    html5QrCode.stop().then(() => {
                        document.getElementById('qr-modal').classList.add('hidden'); document.getElementById('qr-modal').classList.remove('flex');
                        addToZukan(dec); catVoice.currentTime = 0; catVoice.play().catch(()=>{});
                        showCustomAlert('🎉 シークレット発見！', `「${CAT_DATA[dec].name}」をゲットしたニャ！`);
                    });
                }
            }, (err) => {}).catch(err => { showCustomAlert('エラー', 'カメラの起動に失敗しました。'); document.getElementById('qr-modal').classList.add('hidden'); document.getElementById('qr-modal').classList.remove('flex'); });
        });
        document.getElementById('close-qr-btn').addEventListener('click', () => { if (html5QrCode) html5QrCode.stop().then(() => { document.getElementById('qr-modal').classList.add('hidden'); document.getElementById('qr-modal').classList.remove('flex'); }); });

        // ==========================================
        // 【追加】AR撮影モード
        // ==========================================
        const arModal = document.getElementById('ar-modal');
        const arVideo = document.getElementById('ar-video');
        const arCatImg = document.getElementById('ar-cat-img');
        const arCatSelector = document.getElementById('ar-cat-selector');
        const arUiLayer = document.getElementById('ar-ui-layer');
        let arStream = null;

        document.getElementById('open-ar-btn').addEventListener('click', () => {
            arModal.classList.remove('hidden'); arModal.classList.add('flex');
            arCatImg.classList.add('hidden'); // 最初は猫を隠す
            
            // 図鑑から手に入れた猫だけをリストアップ
            arCatSelector.innerHTML = '';
            zukanData.forEach(catId => {
                if(CAT_DATA[catId]) {
                    const btn = document.createElement('img');
                    btn.src = CAT_DATA[catId].image;
                    btn.className = "w-16 h-16 object-contain bg-white rounded-full border-2 border-pink-300 shadow-md flex-shrink-0 active:scale-95";
                    btn.addEventListener('click', () => {
                        arCatImg.src = CAT_DATA[catId].image;
                        arCatImg.classList.remove('hidden');
                        // 画面中央に戻す
                        arCatImg.style.top = '50%'; arCatImg.style.left = '50%';
                    });
                    arCatSelector.appendChild(btn);
                }
            });

            if (arCatSelector.innerHTML === '') {
                arCatSelector.innerHTML = '<p class="text-white text-sm p-2">まずは島を歩いてねこを見つけてニャ！</p>';
            }

            // カメラ起動（背面カメラ指定）
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { arStream = stream; arVideo.srcObject = stream; })
            .catch(err => { showCustomAlert('エラー', 'カメラの使用が許可されていません。'); });
        });

        document.getElementById('close-ar-btn').addEventListener('click', () => {
            if(arStream) arStream.getTracks().forEach(t => t.stop());
            arModal.classList.add('hidden'); arModal.classList.remove('flex');
        });

        // 猫のドラッグ移動機能
        let isDragging = false;
        let startX, startY, initialTop, initialLeft;
        
        arCatImg.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
            // %表記をpxに変換して計算するのは複雑なので、シンプルにstyle.top/leftの現在値を記憶
            const rect = arCatImg.getBoundingClientRect();
            initialLeft = rect.left + rect.width / 2;
            initialTop = rect.top + rect.height / 2;
        });
        arCatImg.addEventListener('touchmove', (e) => {
            if(!isDragging) return;
            e.preventDefault();
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            arCatImg.style.left = `${initialLeft + dx}px`;
            arCatImg.style.top = `${initialTop + dy}px`;
        });
        arCatImg.addEventListener('touchend', () => { isDragging = false; });

        // シャッターボタン（UIを隠す）
        document.getElementById('ar-shutter-btn').addEventListener('click', () => {
            arUiLayer.classList.add('hidden');
            // 3.5秒後にUIが復活する
            setTimeout(() => { arUiLayer.classList.remove('hidden'); }, 3500);
        });
    </script>
</body>
</html>
